name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Tests on Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package
        run: python -m pip install -e '.[test]'
      - name: Run tests
        run: python -m pytest -q

  package:
    name: Build and package smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dev dependencies
        run: python -m pip install -e '.[dev]'
      - name: Dashboard JavaScript syntax check
        run: node --check src/hermes_iphone/dashboard/assets/index.js
      - name: Clean build artifacts
        run: rm -rf dist build *.egg-info
      - name: Build distribution
        run: python -m build
      - name: Check distribution metadata
        run: python -m twine check dist/*
      - name: Fresh wheel install smoke
        run: |
          python -m venv /tmp/hermes-iphone-wheel-smoke
          /tmp/hermes-iphone-wheel-smoke/bin/python -m pip install dist/*.whl
          /tmp/hermes-iphone-wheel-smoke/bin/python - <<'PY'
          import importlib.metadata as md
          import hermes_iphone
          eps = md.entry_points(group='hermes_agent.plugins')
          names = {ep.name for ep in eps}
          assert 'hermes-iphone-plugin' in names
          assert hasattr(hermes_iphone, 'register')
          print(md.version('hermes-iphone-plugin'), hermes_iphone.__file__)
          PY
